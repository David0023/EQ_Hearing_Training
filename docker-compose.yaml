services:
  db:
    image: postgres:16
    container_name: pronunciation_checker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: docs_summary_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/postgres_db
      SECRET_KEY: very_secure_key
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
