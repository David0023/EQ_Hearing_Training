services:
  db:
    image: postgres:16
    container_name: eq_hearing_training_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  migrate:
    build:
      context: .
      dockerfile: backend/dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/postgres_db
      SECRET_KEY: very_secure_key
      PYTHONPATH: /app/backend
    command: ["uv", "run", "--project", "backend", "--locked", "--no-sync", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: docs_summary_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/postgres_db
      SECRET_KEY: very_secure_key
      PYTHONPATH: /app/backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  db-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: eq_hearing_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eq_hearing_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test-password@db-test:5432/eq_hearing_test
      SECRET_KEY: test-secret-key-for-feature-refactor-only
    depends_on:
      db-test:
        condition: service_healthy
    command: ["uv", "run", "--project", "backend", "--locked", "--group", "dev", "python", "-m", "pytest", "-q"]

volumes:
  db_data:
